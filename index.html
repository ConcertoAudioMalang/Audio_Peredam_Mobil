### 4. Bagian `<script>` (Perbaikan Logika JavaScript)

Logika JavaScript Anda terpotong (`document.documentElement.classList.add('d`). Saya telah menyempurnakannya dan menambahkan beberapa perbaikan kecil.

```javascript
    <script src="[https://unpkg.com/aos@2.3.1/dist/aos.js](https://unpkg.com/aos@2.3.1/dist/aos.js)"></script>
    <script>
        AOS.init({
            duration: 1000,
            once: true,
            disable: 'mobile',
        });

        // Deklarasi Elemen
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleBtnMobile = document.getElementById('theme-toggle-mobile');
        const moonIcon = document.getElementById('moon-icon');
        const sunIcon = document.getElementById('sun-icon');
        const moonIconMobile = document.getElementById('moon-icon-mobile');
        const sunIconMobile = document.getElementById('sun-icon-mobile');
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        const mobileMenuLinks = document.querySelectorAll('.mobile-nav-link');
        const scrollToTopBtn = document.getElementById('scroll-to-top');
        const mainHeader = document.getElementById('main-header');
        
        let lastScrollY = window.scrollY;

        // --- LOGIKA THEME START ---
        function updateThemeIcon(isDark) {
            if (isDark) {
                moonIcon.classList.add('hidden');
                sunIcon.classList.remove('hidden');
                moonIconMobile.classList.add('hidden');
                sunIconMobile.classList.remove('hidden');
            } else {
                moonIcon.classList.remove('hidden');
                sunIcon.classList.add('hidden');
                moonIconMobile.classList.remove('hidden');
                sunIconMobile.classList.add('hidden');
            }
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon(isDark);
            handleScroll(); // Panggil handleScroll untuk memperbarui warna header
        }

        // Event Listeners untuk Toggle Theme (Desktop & Mobile)
        themeToggleBtn.addEventListener('click', toggleTheme);
        themeToggleBtnMobile.addEventListener('click', toggleTheme);
        
        // Inisialisasi Tema
        const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const storedTheme = localStorage.getItem('theme');
        const isDark = storedTheme === 'dark' || (!storedTheme && isSystemDark);

        if (isDark) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
        updateThemeIcon(isDark); // Pastikan ikon sesuai dengan tema saat inisialisasi
        // --- LOGIKA THEME END ---

        // --- LOGIKA HEADER SCROLL & SCROLL TO TOP START ---
        const scrollThreshold = 50; // Jarak scroll sebelum header berubah

        function handleScroll() {
            // Logika Header Scrolled
            if (window.scrollY > scrollThreshold) {
                mainHeader.classList.add('scrolled');
            } else {
                mainHeader.classList.remove('scrolled');
            }

            // Logika Scroll to Top Button
            if (window.scrollY > 300) {
                scrollToTopBtn.classList.remove('opacity-0', 'pointer-events-none');
                scrollToTopBtn.classList.add('opacity-100');
            } else {
                scrollToTopBtn.classList.add('opacity-0', 'pointer-events-none');
                scrollToTopBtn.classList.remove('opacity-100');
            }
        }

        scrollToTopBtn.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });

        window.addEventListener('scroll', handleScroll);
        window.addEventListener('DOMContentLoaded', handleScroll); // Panggil saat load untuk inisialisasi

        // --- LOGIKA HEADER SCROLL & SCROLL TO TOP END ---

        // --- LOGIKA MOBILE MENU START ---
        mobileMenuButton.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
            // Toggle icon bars/close (opsional, bisa ditambahkan)
        });

        // Tutup menu saat link diklik (di mobile)
        mobileMenuLinks.forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu.classList.add('hidden');
            });
        });
        // --- LOGIKA MOBILE MENU END ---

        // --- LOGIKA COPYRIGHT YEAR START ---
        document.getElementById('copyright-year').textContent = new Date().getFullYear();
        // --- LOGIKA COPYRIGHT YEAR END ---
    </script>
